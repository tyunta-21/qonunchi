# Настройки для Fly.io. Имя приложения подставляет deploy_fly.sh (флаг --app).
app = "qonunchi"
primary_region = "fra"   # Франкфурт: ближе всего к Узбекистану и Турции

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  # Сайт всегда включён, чтобы у проверяющего не было «холодного старта»
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/v1/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
